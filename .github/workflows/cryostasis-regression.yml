name: Cryostasis regression
on:
  push:
    branches: [codex/hl2-cryostasis-full-parity]
  pull_request:
    paths:
      - 'engine/matsys_interface.cpp'
      - 'game/client/view_scene.cpp'
      - 'game/client/viewrender.cpp'
      - 'game/client/viewpostprocess*'
      - 'public/materialsystem/cryostasis_helpers.h'
      - 'materialsystem/stdshaders/*cryostasis*'
      - 'materialsystem/stdshaders/*Cryostasis*'
      - 'materialsystem/stdshaders/Engine_Post*'
      - 'game/hl2/shaders/fxc/*cryostasis*'
      - 'game/hl2/shaders/fxc/engine_post_ps20b.vcs'
      - 'scripts/*cryostasis*'
      - 'scripts/tests/cryostasis/**'
      - '.github/workflows/cryostasis-regression.yml'
permissions:
  contents: read
jobs:
  cpu-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/test-cryostasis.py --sanitize
  shaders:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile every shipped shader combo
        shell: powershell
        run: scripts/build-cryostasis-vcs.ps1
      - name: Save regenerated bytecode for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cryostasis-vcs
          path: |
            game/hl2/shaders/fxc/engine_post_ps20b.vcs
            game/hl2/shaders/fxc/cryostasis_magichdr_inverse_ps20b.vcs
            game/hl2/shaders/fxc/cryostasis_magichdr_blur_ps20b.vcs
          retention-days: 7
      - name: Require shipped bytecode to match sources
        run: git diff --exit-code -- game/hl2/shaders/fxc
  native-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch build dependencies
        run: git submodule update --init --depth=1
      - name: Configure and build changed components
        shell: cmd
        run: |
          call waf.bat configure -T release --32bits --disable-warns
          if errorlevel 1 exit /b 1
          call waf.bat build --targets=engine,stdshader_dx9,client -j4
